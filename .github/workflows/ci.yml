name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:

  # ----------------------------------------
  # Job 1: Lint and Code Quality
  # ----------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: pip install flake8 black isort

      - name: Check formatting with black
        run: black --check src/ api/ dashboard/

      - name: Check imports with isort
        run: isort --check-only src/ api/ dashboard/

      - name: Lint with flake8
        run: |
          flake8 src/ api/ dashboard/ \
            --max-line-length=100 \
            --ignore=E203,W503 \
            --exclude=__pycache__


  # ----------------------------------------
  # Job 2: Unit Tests
  # ----------------------------------------
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing
        env:
          PYTHONPATH: src

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false


  # ----------------------------------------
  # Job 3: Data Validation Check
  # ----------------------------------------
  data-validation:
    name: Data Schema Validation
    runs-on: ubuntu-latest
    needs: test
    # Only run on main branch where data is available
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install great-expectations pandas

      - name: Run schema validation
        run: python src/data_validation.py
        env:
          PYTHONPATH: src
        continue-on-error: true  # Don't fail CI if data not present


  # ----------------------------------------
  # Job 4: Docker Build Check
  # ----------------------------------------
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f Dockerfile.api -t fraud-api:test .

      - name: Build Dashboard image
        run: docker build -f Dockerfile.dashboard -t fraud-dashboard:test .

      - name: Test API health check
        run: |
          docker run -d --name test_api -p 8000:8000 fraud-api:test
          sleep 15
          curl -f http://localhost:8000/health || echo "Health check skipped (models not present)"
          docker stop test_api


  # ----------------------------------------
  # Job 5: Drift Check (runs on schedule)
  # ----------------------------------------
  drift-check:
    name: Model Drift Check
    runs-on: ubuntu-latest
    # Run daily at 6am UTC and on push to main
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install monitoring dependencies
        run: pip install evidently pandas numpy joblib

      - name: Run drift monitoring
        run: python src/monitor.py
        env:
          PYTHONPATH: src
        continue-on-error: true

      - name: Upload drift reports
        uses: actions/upload-artifact@v4
        with:
          name: drift-reports
          path: reports/
          retention-days: 30
        if: always()

      - name: Check drift threshold and notify
        run: |
          python -c "
          import json, sys, os
          report_path = 'reports/monitoring_summary.json'
          if not os.path.exists(report_path):
              print('No monitoring report found, skipping drift check')
              sys.exit(0)
          with open(report_path) as f:
              summary = json.load(f)
          share = summary.get('share_drifted', 0)
          print(f'Share of drifted features: {share:.2%}')
          if share > 0.30:
              print('WARNING: Significant drift detected. Retraining recommended.')
              sys.exit(1)  # Fail the step to trigger notification
          print('Drift within acceptable range.')
          "
        continue-on-error: true

# ----------------------------------------
# Scheduled drift check
# ----------------------------------------
on_schedule:
  - cron: "0 6 * * *"
